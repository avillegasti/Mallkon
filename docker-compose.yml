services:
  db:
    image: postgres:16-alpine
    container_name: northfi-release-db
    environment:
      POSTGRES_DB: release_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: release_password_secure
    volumes:
      - ./state/postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  portal-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: northfi-release-portal-api:local
    container_name: northfi-release-portal-api
    depends_on:
      - keycloak
      - db
    environment:
      DATABASE_URL: postgresql://postgres:release_password_secure@db:5432/release_portal
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/northfi
      KEYCLOAK_AUDIENCE: release-dashboard
      ARTIFACT_ROOT: /artifacts
      DASHBOARD_DATA_DIR: /artifacts/dashboard
    volumes:
      - ${DASHBOARD_STATE_DIR:-./state}:/data
      - ${YOCTO_ARTIFACT_ROOT:-/data/yocto/artifacts}:/artifacts
      - ./backend/indexer:/app/scripts:ro
    restart: unless-stopped

  dashboard-indexer:
    image: ${DASHBOARD_INDEXER_IMAGE:-eavillegas-northfinding-v10a-yocto-builder:latest}
    container_name: northfi-release-dashboard-indexer
    working_dir: /app
    user: "${DASHBOARD_INDEXER_UID:-1003}:${DASHBOARD_INDEXER_GID:-1003}"
    environment:
      ARTIFACT_ROOT: /artifacts
      DASHBOARD_DATA_DIR: /artifacts/dashboard
      DASHBOARD_INDEX_INTERVAL_SECONDS: ${DASHBOARD_INDEX_INTERVAL_SECONDS:-300}
    volumes:
      - ${YOCTO_ARTIFACT_ROOT:-/data/yocto/artifacts}:/artifacts
      - ./backend/indexer:/app/scripts:ro
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - 'while true; do python3 /app/scripts/rebuild-index.py; sleep "${DASHBOARD_INDEX_INTERVAL_SECONDS:-300}"; done'
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: northfi-release-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HTTP_ENABLED: "true"
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    volumes:
      - ./state/keycloak:/opt/keycloak/data
      - ./backend/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    restart: unless-stopped

  release-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: northfi-release-dashboard:local
    container_name: northfi-release-dashboard
    ports:
      - "${DASHBOARD_PORT:-8088}:80"
    volumes:
      - ${DASHBOARD_DATA_DIR:-/data/yocto/artifacts/dashboard}:/usr/share/nginx/html/data:ro
    depends_on:
      - dashboard-indexer
      - portal-api
    restart: unless-stopped
