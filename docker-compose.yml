services:
  portal-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: northfi-release-portal-api:local
    container_name: northfi-release-portal-api
    environment:
      PORTAL_DB_PATH: /data/portal.db
    volumes:
      - ${DASHBOARD_STATE_DIR:-./state}:/data
    restart: unless-stopped

  dashboard-indexer:
    image: ${DASHBOARD_INDEXER_IMAGE:-eavillegas-northfinding-v10a-yocto-builder:latest}
    container_name: northfi-release-dashboard-indexer
    working_dir: /app
    user: "${DASHBOARD_INDEXER_UID:-1003}:${DASHBOARD_INDEXER_GID:-1003}"
    environment:
      ARTIFACT_ROOT: /artifacts
      DASHBOARD_DATA_DIR: /artifacts/dashboard
      DASHBOARD_INDEX_INTERVAL_SECONDS: ${DASHBOARD_INDEX_INTERVAL_SECONDS:-300}
    volumes:
      - ${YOCTO_ARTIFACT_ROOT:-/data/yocto/artifacts}:/artifacts
      - ./scripts:/app/scripts:ro
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - 'while true; do python3 /app/scripts/rebuild-index.py; sleep "${DASHBOARD_INDEX_INTERVAL_SECONDS:-300}"; done'
    restart: unless-stopped

  release-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: northfi-release-dashboard:local
    container_name: northfi-release-dashboard
    ports:
      - "${DASHBOARD_PORT:-8088}:80"
    volumes:
      - ${DASHBOARD_DATA_DIR:-/data/yocto/artifacts/dashboard}:/usr/share/nginx/html/data:ro
    depends_on:
      - dashboard-indexer
      - portal-api
    restart: unless-stopped
